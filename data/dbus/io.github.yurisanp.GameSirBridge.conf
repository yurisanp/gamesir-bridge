<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Só o serviço (root) publica o nome; qualquer um pode chamar. Mudanças passam pelo polkit. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.yurisanp.GameSirBridge"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.yurisanp.GameSirBridge"/>
  </policy>
</busconfig>
