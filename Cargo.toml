[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/yurisanp/gamesir-bridge"
authors = ["Yuri Pereira"]

[workspace.dependencies]
gamesir-core = { path = "crates/core", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
